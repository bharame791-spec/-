<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ارتقاء — آخر يوم للتسجيل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=block" rel="stylesheet">
<style>
@font-face{font-family:'Palestine';src:url('../assets/Palestine-Regular.ttf') format('truetype');font-display:block}
:root{--em:#1A6A4F;--emD:#0E4A37;--emL:#E6F3EC;--iv:#FFF8EC;--gold:#F2B544;--goldD:#C7811A;--coral:#FF8A65;--coralD:#E8664A;--ink:#234038}
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
.post{position:relative;width:1080px;overflow:hidden;font-family:'Tajawal',sans-serif;color:var(--ink);
  background:radial-gradient(ellipse at 90% 0%,#E3F2E9 0%,rgba(227,242,233,0) 40%),radial-gradient(ellipse at 5% 70%,#FFEBC9 0%,rgba(255,235,201,0) 40%),var(--iv)}
.disp{font-family:'Palestine',sans-serif;font-weight:400}
.col{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;text-align:center}

.alert{display:inline-flex;align-items:center;gap:14px;background:var(--coral);color:#fff;font-weight:900;font-size:38px;padding:10px 32px 14px;border-radius:60px}
.alert i{display:inline-block;width:36px;height:36px;border-radius:50%;background:#fff;color:var(--coralD);font-style:normal;font-size:28px;line-height:38px}

.h1{font-size:100px;line-height:1.35;color:var(--em);white-space:nowrap}
.h1 .hl{color:var(--coralD)}
.line1{display:flex;align-items:center;gap:24px}
.line1 .fi{font-size:58px;color:var(--em);line-height:1.4}
#wm{height:112px}
.line2{font-weight:900;font-size:42px;color:var(--ink)}
.line2 .free{color:var(--coralD)}
.logo{height:120px}
.top{width:100%;padding:0 64px;display:flex;justify-content:space-between;align-items:center}

.cards{display:flex;gap:36px}
.card{width:300px;height:250px;background:#fff;border-radius:30px;box-shadow:0 0 0 3px var(--gold),0 16px 30px rgba(26,106,79,.10);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.card .k{font-weight:900;font-size:34px;color:var(--goldD)}
.card .v{font-family:'Palestine';font-size:96px;line-height:1.25;color:var(--em)}
.card .v.sm{font-size:64px;line-height:1.5}
.card .s{font-weight:900;font-size:34px;color:var(--ink)}
.card.cal{justify-content:flex-start}
.card.cal .hd{width:100%;background:var(--coral);color:#fff;font-weight:900;font-size:36px;padding:10px 0 14px}
.card.cal .v{margin-top:4px}

.cta{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:5px dashed rgba(26,106,79,.28);display:flex;align-items:center;justify-content:center;gap:70px}
.notch{position:absolute;top:-30px;width:60px;height:60px;border-radius:50%;background:var(--iv)}
.cta .a{font-size:84px;color:var(--em);line-height:1.15}
.cta .b{font-size:40px;font-weight:900;color:var(--coralD);margin-top:24px}
.qr{width:240px;height:240px;flex:none;background:#fff;border-radius:24px;box-shadow:0 0 0 5px var(--gold);display:flex;align-items:center;justify-content:center}
.qr img{width:218px;height:218px}
</style>
</head>
<body>
<div class="post" id="post">
  <div class="col" id="col">
    <div class="top" id="e0"><span class="alert"><i>!</i>تنبيه هام</span><img class="logo" src="../assets/logo180.png"></div>
    <div class="h1 disp" id="e1">غدًا <span class="hl">آخر يوم</span> للتسجيل</div>
    <div class="line1" id="e2"><span class="disp fi">في مبادرة</span><div id="wm"></div></div>
    <div class="line2" id="e3">لتعليم التربية الإسلامية <span class="free">(مجانًا)</span> – مركز 180 درجة</div>
    <div class="cards" id="e5">
      <div class="card cal"><div class="hd">الخميس</div><div class="v">5</div><div class="s">نوفمبر</div></div>
      <div class="card"><div class="k">الفئة المستهدفة</div><div class="v">9 – 15</div><div class="s">سنة</div></div>
    </div>
  </div>

  <div class="cta" id="cta">
    <div class="notch" style="left:-30px"></div><div class="notch" style="right:-30px"></div>
    <div id="ctatxt"><div class="a disp">سجّل الآن</div><div class="b">قبل إغلاق باب التسجيل</div></div>
    <div class="qr" id="qrbox"><img src="../assets/qr.png"></div>
  </div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const STORY=new URLSearchParams(location.search).get('story')==='1';
function wordmark(host,fs){
  const svg=document.createElementNS(NS,'svg');host.appendChild(svg);
  const tx=document.createElementNS(NS,'text');tx.textContent='ارتقــــاء';
  tx.setAttribute('font-family','Palestine');tx.setAttribute('font-size',fs);tx.setAttribute('fill','#1A6A4F');tx.setAttribute('direction','rtl');svg.appendChild(tx);
  let x0=1e9,x1=-1e9;for(let i=4;i<8;i++){const e=tx.getExtentOfChar(i);x0=Math.min(x0,e.x);x1=Math.max(x1,e.x+e.width)}
  const bb=tx.getBBox(),w=x1-x0,bh=fs*.29,by=-fs*.176;
  const r=document.createElementNS(NS,'rect');r.setAttribute('x',x0+w*.17);r.setAttribute('y',by-bh/2);r.setAttribute('width',w*.66);r.setAttribute('height',bh);r.setAttribute('fill','#F2B544');svg.appendChild(r);
  const pad=fs*.08;svg.setAttribute('viewBox',`${bb.x-pad} ${bb.y} ${bb.width+2*pad} ${bb.height}`);
  svg.style.height='100%';svg.style.width='auto';
}
function build(){
  // vertical rhythm (top offset + gaps between elements), per format
  const H=STORY?1920:1350, CTA=STORY?400:300;
  const TOP=STORY?110:44, GAPS={1:STORY?90:46,2:STORY?14:8,3:STORY?28:20,5:STORY?110:66};
  document.getElementById('post').style.height=H+'px';
  document.getElementById('cta').style.height=CTA+'px';
  document.getElementById('col').style.paddingTop=TOP+'px';
  Object.entries(GAPS).forEach(([i,g])=>document.getElementById('e'+i).style.marginTop=g+'px');
  if(STORY){document.getElementById('e1').style.fontSize='116px';document.getElementById('wm').style.height='140px';document.querySelector('.logo').style.height='150px';
    document.querySelectorAll('.card').forEach(c=>{c.style.width='360px';c.style.height='300px'});document.querySelector('.cards').style.gap='44px';
    document.querySelectorAll('.card .v').forEach(v=>v.style.fontSize=v.classList.contains('sm')?'74px':'120px');}
  wordmark(document.getElementById('wm'),130);
}
window.READY=false;
document.fonts.ready.then(()=>Promise.all(['Palestine','Tajawal'].map(f=>document.fonts.load(`40px "${f}"`)))).then(()=>{build();
  Promise.all([...document.images].map(im=>im.complete?1:new Promise(r=>im.onload=r))).then(()=>{window.READY=true})});
</script>
</body>
</html>
