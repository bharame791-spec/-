<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>محمد الضيف | رجل الظل</title>
<style>
@font-face{font-family:Lalezar;src:url(fonts/lalezar-arabic-400-normal.woff2)format('woff2'),url(fonts/lalezar-latin-400-normal.woff2)format('woff2');}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-arabic-400-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F,U+2010-2011,U+204F,U+2E41;}
@font-face{font-family:Cairo;font-weight:400;src:url(fonts/cairo-latin-400-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2013-2014,U+2022;}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-arabic-700-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F;}
@font-face{font-family:Cairo;font-weight:700;src:url(fonts/cairo-latin-700-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2013-2014,U+2022;}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-arabic-900-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF,U+200C-200F;}
@font-face{font-family:Cairo;font-weight:900;src:url(fonts/cairo-latin-900-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2013-2014,U+2022;}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-sans-arabic-arabic-400-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF;}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-sans-arabic-latin-400-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2013-2014,U+00B0;}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/ibm-plex-sans-arabic-arabic-600-normal.woff2)format('woff2');unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFF;}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/ibm-plex-sans-arabic-latin-600-normal.woff2)format('woff2');unicode-range:U+0000-00FF,U+2013-2014,U+00B0;}

:root{--ink:#121110;--paper:#e8e2d5;--red:#8e1b1b;--red2:#a52222;--grey:#8a857c}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Cairo,sans-serif}
.abs{position:absolute}
.scene{position:absolute;inset:0;overflow:hidden}
.full{position:absolute;inset:0}
.bg-paper{background:url(../assets/paper.jpg) center/cover}
.bg-dark{background:url(../assets/paper_dark.jpg) center/cover}
.bg-old{background:url(../assets/paper_old.jpg) center/cover}
.rtl{direction:rtl}
.title{font-family:Lalezar;color:#f2ede3;line-height:1;white-space:nowrap}
.tape{font-family:Cairo;font-weight:900;color:var(--ink);background:url(../assets/paper_card.jpg) center/cover;padding:10px 34px 16px;white-space:nowrap;direction:rtl}
.tape.red{background:var(--red);color:#f2ede3}
.tape.ink{background:var(--ink);color:#f2ede3}
.stamp{font-family:Cairo;font-weight:900;color:var(--red2);border:8px solid var(--red2);padding:0 26px 8px;line-height:1.15;white-space:nowrap;mix-blend-mode:multiply;
  -webkit-mask:url(../assets/grain_2.png) center/220%;}
.stamp.light{mix-blend-mode:normal;color:#c83232;border-color:#c83232;-webkit-mask:none;opacity:.92}
.clip{background:#000 url(../assets/paper_card.jpg) center/cover;padding:16px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.clip img{display:block;width:100%;height:100%;object-fit:cover;filter:contrast(1.15) brightness(.98)}
.news{background:url(../assets/paper_old.jpg) center/cover;color:var(--ink);padding:26px 30px;box-shadow:0 14px 34px rgba(0,0,0,.4);direction:rtl}
.news h3{font-family:Cairo;font-weight:900;margin:0 0 12px;line-height:1.15}
.news .meta{font-family:Plex;font-size:20px;color:#5b554c;border-bottom:2px solid #3a3530;padding-bottom:6px;margin-bottom:14px;display:flex;justify-content:space-between}
.cols{display:grid;gap:18px}
.cols i{display:block;height:100%;
  background:repeating-linear-gradient(to bottom,#4a4540 0 7px,transparent 7px 19px);
  -webkit-mask:linear-gradient(to left,#000 0 85%,rgba(0,0,0,.6) 100%);opacity:.75}
.redact{background:#0c0b0a}
.mono{font-family:Plex;color:#6d675e;letter-spacing:2px}
.info{font-family:Plex;font-weight:600;color:var(--ink);direction:rtl}
.overlay{position:absolute;inset:0;pointer-events:none}
.cam{position:absolute;inset:0;transform-origin:50% 45%}
.pwrap{filter:drop-shadow(0 16px 26px rgba(0,0,0,.4))}
.pstamp{background:#f3efe6;padding:20px;box-sizing:border-box;width:100%;height:100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle,transparent 8px,#000 8.5px) -12px -12px/24px 24px border-box;
  mask:linear-gradient(#000 0 0) content-box,radial-gradient(circle,transparent 8px,#000 8.5px) -12px -12px/24px 24px border-box}
.pstamp.red{background:#9a2a2a}
.polaroid{background:#f3efe6;padding:18px 18px 70px;box-sizing:border-box;width:100%;height:100%}
.media{position:relative;width:100%;height:100%;overflow:hidden;background:#111}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.15)}
.cal{background:url(../assets/paper_card.jpg) center/cover;width:560px;height:640px;box-shadow:0 20px 40px rgba(0,0,0,.35);text-align:center;direction:rtl;font-family:Cairo}
.cal .top{background:var(--red);color:#f2ede3;font-weight:900;font-size:76px;height:150px;line-height:150px;position:relative}
.cal .top:before,.cal .top:after{content:'';position:absolute;top:-26px;width:26px;height:60px;border-radius:13px;background:#2b2826}
.cal .top:before{left:120px}.cal .top:after{right:120px}
.cal .day{font-weight:900;font-size:300px;line-height:1.25;color:var(--ink)}
.cal .yr{font-family:Plex;font-size:52px;color:#5b554c;margin-top:-30px}
.acard{background:url(../assets/paper_card.jpg) center/cover;width:620px;height:420px;box-shadow:0 22px 44px rgba(0,0,0,.5);direction:rtl;font-family:Cairo;padding:30px 40px;box-sizing:border-box}
.acard .y{font-weight:900;font-size:190px;line-height:1;color:var(--ink)}
.acard .l{font-family:Plex;font-weight:600;font-size:40px;color:#4a453f;border-top:3px solid #2b2826;padding-top:10px;margin-top:10px}
.vf{position:absolute;width:90px;height:90px;border-color:#f2ede3;border-style:solid;border-width:0}
.bok{position:absolute;border-radius:50%}
.wbar{flex:1;border-radius:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="mbx" x="-10%" y="-2%" width="120%" height="104%"><feGaussianBlur id="mbxg" stdDeviation="0 0"/></filter><filter id="mby" x="-2%" y="-10%" width="104%" height="120%"><feGaussianBlur id="mbyg" stdDeviation="0 0"/></filter></svg>
<div id="stage"></div>
<script src="main.js"></script>
</body>
</html>
